[project]
name = "footprintscanner"
version = "0.1.0"
description = "Digital footprint scanner — scans the clearnet for public digital footprint and generates actionable PDF security audit reports"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "requests>=2.31",
    "rich>=13.7",
    "reportlab>=4.0",
    "tabulate>=0.9",
    "python-whois>=0.8",
    "dnspython>=2.4",
    "urllib3>=2.1",
    "tldextract>=5.1",
    "jproperties>=2.1",
    "click>=8.1",
    "colorama>=0.4",
    "tenacity>=8.2",
    "pytz>=2023.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]

[project.scripts]
footprintscanner = "footprintscanner.main:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
